plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Forge discovers nested Jar-in-Jar dependencies before any @Mod class is constructed.
// CozyCafe 1.9 embeds LibTooltips 2.2 under this Curse Maven identity while
// Starcatcher 3.1.4.1 embeds 2.3 under a different Modrinth identity. Supplying
// the 2.3 binary under CozyCafe's identity makes JarJar discard its older copy;
// either remaining libtooltips candidate is then the same 2.3 implementation.
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    ivy {
        name = 'ICEcoreLibTooltipsCompat'
        url = 'https://api.modrinth.com'
        patternLayout {
            artifact "maven/maven/modrinth/libtooltips/${libtooltips_compat_upstream_version}/libtooltips-${libtooltips_compat_upstream_version}.jar"
        }
        metadataSources { artifact() }
        content { includeModule 'curse.maven', 'libtooltips-1370245' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    def libtooltipsCompat = jarJar("curse.maven:libtooltips-1370245:${libtooltips_compat_selector_version}") {
        transitive = false
    }
    jarJar.ranged(libtooltipsCompat, "[${libtooltips_compat_selector_version},${libtooltips_compat_selector_version.toInteger() + 1})")
    jarJar.pin(libtooltipsCompat, libtooltips_compat_selector_version)
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.49.0.188')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.49.0.188')
    // Full JEI forge jar on the compile classpath too: recipe-hide favorites clearing must reference
    // JEI internals (mezz.jei.gui.bookmarks.*), which live in this jar, not the api jars.
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.49.0.188')
    runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.49.0.188')
    compileOnly fg.deobf('local:cozycafe:1.9-all')
    compileOnly fg.deobf('local:kaleidoscopetavern:1.2.0-forge+mc1.20.1')
    compileOnly fg.deobf('local:chatbox:1.1.4+1.20.1-forge')
    compileOnly files('libs/sdmshoprework-forge-1.20.1-6.11-pre.jar')
    compileOnly files('libs/ftb-library-forge-2001.2.10.jar', 'libs/architectury-9.2.14-forge.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                // Forge 1.20.1 discovers Sponge Mixin configs from the JAR
                // manifest. The [[mixins]] mods.toml entry is not enough for
                // the client launch path used by the pack.
                'MixinConfigs'          : 'icecore.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
    dependsOn 'verifyLibtooltipsCompatSource'
    finalizedBy 'reobfJarJar'
}

tasks.register('verifyLibtooltipsCompatSource') {
    inputs.files(configurations.jarJar)
    inputs.property('expectedSha256', libtooltips_compat_sha256)

    doLast {
        def artifacts = configurations.jarJar.resolvedConfiguration.resolvedArtifacts.findAll { resolved ->
            resolved.moduleVersion.id.group == 'curse.maven'
                    && resolved.name == 'libtooltips-1370245'
                    && resolved.moduleVersion.id.version == libtooltips_compat_selector_version
        }
        if (artifacts.size() != 1) {
            throw new GradleException("Expected exactly one LibTooltips compatibility artifact, found ${artifacts.size()}")
        }

        def artifact = artifacts.first().file
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        def actualSha256 = digest.digest().encodeHex().toString()
        if (!actualSha256.equalsIgnoreCase(libtooltips_compat_sha256)) {
            throw new GradleException("Unexpected LibTooltips compatibility artifact SHA-256: ${actualSha256}")
        }

        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            if (zip.getEntry('com/wdiscute/libtooltips/Tooltips$ItemTooltip.class') == null) {
                throw new GradleException('LibTooltips compatibility artifact does not contain Tooltips$ItemTooltip')
            }
            def modsToml = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!modsToml.contains("version=\"${libtooltips_compat_upstream_version}\"")) {
                throw new GradleException("LibTooltips compatibility artifact is not ${libtooltips_compat_upstream_version}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
