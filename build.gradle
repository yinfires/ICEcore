plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    implementation fg.deobf('local:cookingforblockheads-forge-1.20.1:16.0.15')
    implementation fg.deobf('local:balm-forge-1.20.1:7.3.44')
    compileOnly files('libs/kaleidoscope_grilling-1.1.1-forge1.20.1.jar')
    compileOnly fg.deobf('local:dew_drop_farmland_growth:9.0')
    compileOnly fg.deobf('local:dew_drop_watering_cans:1.0.2')
    compileOnly fg.deobf('local:bots_lib:4.1.1')
    compileOnly files('libs/smartkeyprompts-forge-1.20.1-1.1.3-hotfix-all.jar')
    testRuntimeOnly files('libs/smartkeyprompts-forge-1.20.1-1.1.3-hotfix-all.jar')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.49.0.188')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.49.0.188')
    // Full JEI forge jar on the compile classpath too: recipe-hide favorites clearing must reference
    // JEI internals (mezz.jei.gui.bookmarks.*), which live in this jar, not the api jars.
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.49.0.188')
    runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.49.0.188')
    compileOnly fg.deobf('local:cozycafe:1.9-all')
    compileOnly files('libs/Placebo-1.20.1-8.6.3.jar')
    compileOnly fg.deobf('local:kaleidoscopetavern:1.2.0-forge+mc1.20.1')
    compileOnly fg.deobf('local:letsdo-farm_and_charm-forge:1.0.14')
    compileOnly fg.deobf('local:youkaisfeasts:0.5.0')
    compileOnly fg.deobf(files('libs/[森罗物语：厨房] kaleidoscopecookery-1.4.1-forge+mc1.20.1.jar'))
    compileOnly fg.deobf(files('libs/Jade-1.20.1-Forge-11.13.3.jar'))
    compileOnly fg.deobf('local:chatbox:1.1.5+1.20.1-forge')
    compileOnly files('libs/sdmshoprework-forge-1.20.1-6.11-pre.jar')
    compileOnly files('libs/ftb-library-forge-2001.2.10.jar', 'libs/architectury-9.2.14-forge.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('test', Test).configure {
    dependsOn 'createMcpToSrg', 'extractSrg'
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = ''

    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                // Forge 1.20.1 discovers Sponge Mixin configs from the JAR
                // manifest. The [[mixins]] mods.toml entry is not enough for
                // the client launch path used by the pack.
                'MixinConfigs'          : 'icecore.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// Validate the actual distributable, after ForgeGradle has rewritten Minecraft calls.
tasks.register('verifyProductionJar') {
    dependsOn 'reobfJar'
    doLast {
        def mappings = file('build/createMcpToSrg/output.tsrg')
        def renamed = [:]
        String owner = null
        mappings.eachLine('UTF-8') { line ->
            if (!line.startsWith('\t')) {
                owner = line.split(' ')[0]
            } else if (owner?.startsWith('net/minecraft/')) {
                def parts = line.trim().split(' ')
                if (parts.length == 3 && parts[1].startsWith('(') && parts[0] != parts[2]) {
                    renamed[owner + '.' + parts[0] + parts[1]] = parts[2]
                }
            }
        }
        def artifact = providers.gradleProperty('productionJar').isPresent()
                ? file(providers.gradleProperty('productionJar').get()) : tasks.jar.archiveFile.get().asFile
        def failures = []
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith('.class')) return
                zip.getInputStream(entry).withCloseable { stream ->
                    def input = new DataInputStream(stream)
                    if (input.readInt() != (int) 0xCAFEBABE) throw new GradleException('Invalid class: ' + entry.name)
                    input.readUnsignedShort(); input.readUnsignedShort()
                    int count = input.readUnsignedShort()
                    def pool = new Object[count]
                    def tags = new int[count]
                    for (int i = 1; i < count; i++) {
                        int tag = input.readUnsignedByte(); tags[i] = tag
                        switch (tag) {
                            case 1: pool[i] = input.readUTF(); break
                            case 3: case 4: input.readInt(); break
                            case 5: case 6: input.readLong(); i++; break
                            case 7: case 8: case 16: case 19: case 20: pool[i] = input.readUnsignedShort(); break
                            case 9: case 10: case 11: case 12: case 17: case 18:
                                pool[i] = [input.readUnsignedShort(), input.readUnsignedShort()]; break
                            case 15: input.readUnsignedByte(); input.readUnsignedShort(); break
                            default: throw new GradleException('Unknown constant pool tag: ' + tag)
                        }
                    }
                    for (int i = 1; i < count; i++) if (tags[i] == 10 || tags[i] == 11) {
                        def reference = pool[i]
                        def nameAndType = pool[reference[1]]
                        String key = pool[pool[reference[0]]] + '.' + pool[nameAndType[0]] + pool[nameAndType[1]]
                        if (renamed.containsKey(key)) failures.add(entry.name + ': ' + key + ' -> ' + renamed[key])
                    }
                }
            }
        }
        if (!failures.isEmpty()) throw new GradleException('Unmapped Minecraft calls in production JAR:\n' + failures.take(20).join('\n'))
        logger.lifecycle('Production Minecraft method mappings verified: ' + artifact.name)
    }
}
tasks.named('check').configure { dependsOn 'verifyProductionJar' }
