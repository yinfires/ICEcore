pluginManagement {
    // Apply before plugin resolution, including builds launched through IDEA.
    gradle.startParameter.offline = !providers.gradleProperty('icecoreOnline')
            .map { it.toBoolean() }.getOrElse(false)
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'ICEcore'
